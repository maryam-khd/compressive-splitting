[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compressive-splitting"
version = "0.1.0"
description = "Minimal FEniCSx implementation of the boundary-induced tension coefficient for compressive splitting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Maryam Khodadad"}
]
dependencies = [
  "numpy",
  "mpi4py"
]

[tool.setuptools.packages.find]
where = ["src"]
